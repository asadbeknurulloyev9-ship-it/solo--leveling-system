<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Solo Leveling System v27.0</title> 
<style> 
body { background-color: #0b0f19; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; } 
.system-box { border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.05); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); border-radius: 10px; padding: 20px; width: 90%; max-width: 450px; text-align: center; margin-bottom: 20px; } 
h1 { color: #00d2ff; text-transform: uppercase; margin-bottom: 5px; font-size: 24px; } 
.rank { color: #ff3e3e; font-weight: bold; font-size: 18px; margin-bottom: 5px; } 
.title-badge { color: #ffaa00; font-weight: bold; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; } 
.xp-container { width: 100%; background-color: #111827; border: 1px solid #00d2ff; border-radius: 5px; margin-bottom: 15px; overflow: hidden; } 
.xp-bar { height: 12px; background: linear-gradient(90deg, #0055ff, #00d2ff); transition: width 0.5s; } 
.timer-box { background: #111827; border: 1px solid #ff3e3e; color: #ff3e3e; font-size: 22px; padding: 10px; margin-bottom: 15px; font-family: monospace; font-weight: bold; } 
.quest-title { background: #00d2ff; color: #0b0f19; padding: 5px by 10px; font-weight: bold; display: inline-block; margin-bottom: 15px; text-transform: uppercase; } 
.water-box { border-color: #00a2ff; background: rgba(0, 162, 255, 0.05); } 
.challenge-box { border-color: #ffaa00; background: rgba(255, 170, 0, 0.05); display: none; } 
.stat-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); margin: 5px 0; padding: 10px; border-radius: 4px; border-left: 3px solid #ffaa00; } 
.stat-btn { background: #ffaa00; color: #0b0f19; border: none; padding: 5px by 15px; font-weight: bold; cursor: pointer; border-radius: 3px; font-size: 16px; } 
.task-list { text-align: left; margin-bottom: 20px; } 
.task-item { background: rgba(255, 255, 255, 0.05); margin: 10px 0; padding: 12px; border-left: 4px solid #00d2ff; display: flex; align-items: center; border-radius: 4px; } 
.task-item input { margin-right: 15px; transform: scale(1.3); cursor: pointer; } 
.btn { background: #00d2ff; color: #0b0b1a; border: none; padding: 12px by 25px; font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; border-radius: 5px; font-size: 16px; } 
.water-btn { background: #00a2ff; color: #fff; margin-top: 10px; } 
.notify-btn { background: #00ff66; color: #0b0f19; margin-bottom: 15px; width: 100%; } 
.reset-btn { background: #ff3e3e; color: #fff; padding: 5px by 10px; font-size: 12px; border: none; cursor: pointer; border-radius: 3px; margin-top: 15px; }
</style>
</head>
<body>

<button class="btn notify-btn" id="notifBtn" onclick="requestNotification()">🔔 ENABLE NOTIFICATIONS</button>

<!-- BLOCK 1: DAILY EXERCISES -->
<div class="system-box">
<h1>[ SYSTEM ACTIVE ]</h1>
<div class="rank" id="lvlDisplay">LEVEL 2 (C-RANK HUNTER)</div>
<div class="title-badge" id="titleDisplay">TITLE: AGILE WOLF</div>

<div style="font-size: 12px; color: #00d2ff; margin-bottom: 5px; text-align: left; font-weight: bold;" id="xpText">XP: 100 / 500</div> 
<div class="xp-container"> 
<div class="xp-bar" id="xpBar" style="width: 20%;"></div> 
</div> 

<div class="timer-box" id="timeDisplay">Current time: 00:00:00</div> 
<div style="color: #ff3e3e; font-size: 12px; margin-bottom: 15px; font-weight: bold;">DEADLINE: UNTIL 06:30 AM</div> 

<div class="quest-title" id="questStatusText">Daily Quest: Strengthen</div> 

<div class="task-list"> 
<div class="task-item"><input type="checkbox" id="t1"><label for="t1">Running (3 KM)</label></div> 
<div class="task-item"><input type="checkbox" id="t2"><label for="t2">Autonomy (32 items) -> STRENGTH</label></div> 
<div class="task-item"><input type="checkbox" id="t3"><label for="t3">Press exercise (32) -> ENDURANCE</label></div> 
<div class="task-item"><input type="checkbox" id="t4"><label for="t4">Prisidania (37 items) -> ASOS</label></div> 
</div> 

<button class="btn" id="submitQuestBtn" onclick="checkQuest()">Complete Quest</button> 
</div>

<h1 style="color: #00ff66;">[ TOTAL RESULTS ACHIEVED ]</h1> 
<div class="quest-title" style="background:#00ff66; color:#0b0f19;">Hunter Statistics</div> 
<div class="task-list">
